<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="物件検討">
<title>物件検討ボード</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="skin-v2.css">
<script>
  // 描画前に配色を当て、リロード時の一瞬のちらつきを防ぐ
  try {
    var t = localStorage.getItem('bukken.theme.v1');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    var s = localStorage.getItem('bukken.skin.v1');
    document.documentElement.setAttribute('data-skin', s === 'classic' ? 'classic' : 'v2');
  } catch (e) { document.documentElement.setAttribute('data-skin', 'v2'); }
</script>
</head>
<body>

<header class="appbar">
  <div class="appbar-in">
    <h1 class="brand">物件検討ボード<span class="brand-sub">暮らしを、もっと確かな選択に</span></h1>
    <div class="appbar-right">
      <span id="syncBadge" class="badge badge-muted" title="同期状態">未接続</span>
      <button id="btnSave" class="btn btn-primary btn-sm" hidden>保存</button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab is-active" data-view="list"><svg class="tab-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg>一覧</button>
    <button class="tab" data-view="compare"><svg class="tab-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v14M4 7l-2 5h4zM16 7l-2 5h4zM4 7h12"/></svg>比較</button>
    <button class="tab" data-view="analysis"><svg class="tab-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16V9M10 16V4M16 16v-5"/></svg>分析</button>
    <button class="tab" data-view="plan"><svg class="tab-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12v12H4zM4 8h12M8 3v3M12 3v3"/></svg>ライフプラン</button>
    <button class="tab" data-view="map"><svg class="tab-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2a5 5 0 015 5c0 4-5 11-5 11S5 11 5 7a5 5 0 015-5zM10 9a2 2 0 100-4 2 2 0 000 4z"/></svg>地図</button>
    <button class="tab" data-view="settings"><svg class="tab-ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 7a3 3 0 100 6 3 3 0 000-6zM10 2v2M10 16v2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M2 10h2M16 10h2M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4"/></svg>設定</button>
  </nav>
</header>

<main id="main" class="main"></main>

<div id="lightbox" class="lightbox" hidden>
  <button class="lb-close" aria-label="閉じる">&times;</button>
  <button class="lb-nav lb-prev" aria-label="前へ">&#8249;</button>
  <img id="lbImg" alt="">
  <button class="lb-nav lb-next" aria-label="次へ">&#8250;</button>
  <div class="lb-cap"><span id="lbCap"></span><span id="lbCount" class="lb-count"></span></div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
