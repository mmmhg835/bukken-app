<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="物件検討">
<title>物件検討ボード</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="appbar">
  <div class="appbar-in">
    <h1 class="brand">物件検討ボード</h1>
    <div class="appbar-right">
      <span id="syncBadge" class="badge badge-muted" title="同期状態">未接続</span>
      <button id="btnSave" class="btn btn-primary btn-sm" hidden>保存</button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab is-active" data-view="list">一覧</button>
    <button class="tab" data-view="compare">比較</button>
    <button class="tab" data-view="map">地図</button>
    <button class="tab" data-view="settings">設定</button>
  </nav>
</header>

<main id="main" class="main"></main>

<div id="lightbox" class="lightbox" hidden>
  <button class="lb-close" aria-label="閉じる">&times;</button>
  <button class="lb-nav lb-prev" aria-label="前へ">&#8249;</button>
  <img id="lbImg" alt="">
  <button class="lb-nav lb-next" aria-label="次へ">&#8250;</button>
  <div class="lb-cap"><span id="lbCap"></span><span id="lbCount" class="lb-count"></span></div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
