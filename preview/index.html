<!doctype html>
<html lang="ja" data-ui="preview">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f8f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="物件検討">
<title>物件検討ボード — 新デザイン</title>
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="preview.css">
<script>
  try {
    var t = localStorage.getItem('bukken.theme.v1');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* 保存領域が使えない場合は端末設定に従う */ }
</script>
</head>
<body>

<header class="appbar">
  <div class="appbar-in">
    <a class="brand" href="#/list" aria-label="物件検討ボードの一覧へ">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11M8 20v-7h8v7M2 20h20"/></svg>
      </span>
      <span class="brand-copy"><b>物件検討ボード</b><small>新デザイン版</small></span>
    </a>
    <div class="appbar-right">
      <span id="syncBadge" class="badge badge-muted" title="同期状態">未接続</span>
      <button id="btnSave" class="btn btn-primary btn-sm" hidden>保存</button>
      <a class="legacy-link" href="../">従来版を開く</a>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="メインメニュー">
    <button class="tab is-active" data-view="list">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v5H4zM4 14h7v5H4zM15 14h5v5h-5z"/></svg><span>一覧</span>
    </button>
    <button class="tab" data-view="compare">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M17 4v16M3 8h8M13 16h8M4 8l3-3 3 3M14 16l3 3 3-3"/></svg><span>比較</span>
    </button>
    <button class="tab" data-view="analysis">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7M3 20h18"/></svg><span>分析</span>
    </button>
    <button class="tab" data-view="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v3M18 3v3M4 8h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1zM8 12h3M13 12h3M8 16h3"/></svg><span>ライフプラン</span>
    </button>
    <button class="tab" data-view="map">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6 7-12a7 7 0 1 0-14 0c0 6 7 12 7 12zM12 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg><span>地図</span>
    </button>
    <button class="tab" data-view="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM19 13.5l2-1.5-2-1.5-.5-1.4.7-2.4-2.5-.7-1.6-1.1L14.5 2h-3l-.6 2.9L9.3 6l-2.5.7.7 2.4L7 10.5 5 12l2 1.5.5 1.4-.7 2.4 2.5.7 1.6 1.1.6 2.9h3l.6-2.9 1.6-1.1 2.5-.7-.7-2.4z"/></svg><span>設定</span>
    </button>
  </nav>
</header>

<div class="view-heading" id="viewHeading">
  <span class="view-accent" aria-hidden="true"></span>
  <h2 id="viewTitle">検討中の物件</h2>
</div>
<main id="main" class="main"></main>

<div id="lightbox" class="lightbox" hidden>
  <button class="lb-close" aria-label="閉じる">&times;</button>
  <button class="lb-nav lb-prev" aria-label="前へ">&#8249;</button>
  <img id="lbImg" alt="">
  <button class="lb-nav lb-next" aria-label="次へ">&#8250;</button>
  <div class="lb-cap"><span id="lbCap"></span><span id="lbCount" class="lb-count"></span></div>
</div>

<div id="toast" class="toast" hidden></div>

<script type="module" src="preview-shell.js"></script>
<script type="module" src="../js/main.js"></script>
</body>
</html>
